baseURL = 'https://joo1024.github.io/'
title = 'Sanctum'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh'
timeZone = 'Asia/Shanghai'
enableRobotsTXT = true
enableEmoji = false
disableKinds = []

[params]
  description = '一个记录思考、修炼、创作与时间的地方。A place for reflection, practice, and making.'
  subtitle = 'A place for reflection, practice, and making.'

[taxonomies]
  form = 'type'
  domain = 'domains'
  path = 'paths'
  tag = 'tags'

# Native taxonomy values come from the plural key; keep authors' scalar type.
[permalinks.taxonomy]
  type = '/types/'
[permalinks.term]
  type = '/types/:slug/'

[frontmatter]
  lastmod = ['lastmod', 'date']

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.parser.attribute]
  block = true
  title = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false
[markup.highlight]
  noClasses = false
  lineNos = false
  tabWidth = 2

[sitemap]
  changeFreq = ''
  priority = -1

[build]
  writeStats = false
