baseURL = 'https://joo1024.github.io/'
title = 'Sanctum'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh'
timeZone = 'Asia/Shanghai'
enableRobotsTXT = true

[params]
  description = '一个记录思考、修炼、创作与时间的地方。A place for reflection, practice, and making.'
  subtitle = 'A place for reflection, practice, and making.'

[taxonomies]
  form = 'form'
  domain = 'domains'
  path = 'paths'
  tag = 'tags'

# Match the author's scalar form field; expose a plural public URL.
[permalinks.taxonomy]
  form = '/forms/'
[permalinks.term]
  form = '/forms/:slug/'

[frontmatter]
  lastmod = ['lastmod', 'date']

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.parser.attribute]
  block = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
[markup.highlight]
  noClasses = false
  tabWidth = 2
