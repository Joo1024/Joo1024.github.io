<header class="site-header">
  <a class="wordmark" href="{{ .Site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}>Sanctum<span class="wordmark-dot" aria-hidden="true">.</span></a>
  <div class="header-tools">
    <nav class="utility-nav" aria-label="全站导航">
      {{ $page := . }}
      {{ range .Site.Data.navigation }}
      {{ $url := .path | relURL }}
      <a href="{{ $url }}" {{ if eq $page.RelPermalink $url }}aria-current="page"{{ end }}>{{ .name }}</a>
      {{ end }}
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" hidden aria-label="切换配色，当前跟随系统">配色 · 系统</button>
  </div>
</header>
{{ if not .IsHome }}
<nav class="section-nav" aria-label="栏目">
  {{ $page := . }}
  {{ range .Site.Data.sections }}
  {{ $url := printf "%s/" .slug | relURL }}
  <a href="{{ $url }}" {{ if or (eq $page.Section .slug) (eq $page.RelPermalink $url) }}aria-current="page"{{ end }}>{{ .name }}</a>
  {{ end }}
</nav>
{{ end }}
