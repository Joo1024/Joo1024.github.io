{{ $posts := slice }}
{{ range .Params.theory_posts }}
  {{ with site.GetPage . }}{{ $posts = $posts | append . }}{{ end }}
{{ end }}
{{ with $posts }}
<aside class="theory-links" aria-label="体系说明">
  <p>体系说明</p>
  <ul>{{ range . }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ul>
</aside>
{{ end }}
