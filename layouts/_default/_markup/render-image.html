<figure>
  {{ $src := .Destination }}
  {{ if and (hasPrefix $src "/") (not (hasPrefix $src "//")) }}{{ $src = strings.TrimPrefix "/" $src | relURL }}{{ end }}
  <img src="{{ $src }}" alt="{{ .Text }}" loading="lazy" decoding="async"{{ with .Title }} title="{{ . }}"{{ end }}>
  {{ with .Title }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
